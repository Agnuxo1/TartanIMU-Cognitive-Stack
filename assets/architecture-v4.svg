<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 560" role="img" aria-labelledby="title desc">
  <title id="title">JEV-Orchestrator v4 control flow</title>
  <desc id="desc">Deterministic checks and a typed JEV route precede a mandatory Luna attempt. A reflex fabric uses local fast paths for routine work and event-driven JEV checkpoints for uncertainty, failure, risk, or phase change. Code gates escalation to Sol, then Astra, and keeps external actions behind human authorization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071525"/><stop offset="1" stop-color="#102b42"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#23c7d9"/><stop offset="1" stop-color="#69e1cf"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#7974ff"/><stop offset="1" stop-color="#ba8cff"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7edbd8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020812" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1480" height="560" rx="30" fill="url(#bg)"/>
  <text x="56" y="58" fill="#f4fbff" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="700">JEV-ORCHESTRATOR · CONTROL PLANE v4</text>
  <text x="56" y="91" fill="#a9c4d4" font-family="Inter,Segoe UI,sans-serif" font-size="15">Models advise; deterministic policy owns budgets, evidence gates and side effects.</text>
  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#shadow)">
    <rect x="48" y="148" width="190" height="142" rx="18" fill="#142d42" stroke="#35576b"/>
    <rect x="268" y="148" width="190" height="142" rx="18" fill="#143644" stroke="#2b8290"/>
    <rect x="488" y="148" width="190" height="142" rx="18" fill="#183947" stroke="#35a5ac"/>
    <rect x="708" y="148" width="210" height="142" rx="18" fill="#23274c" stroke="#7775e9"/>
    <rect x="948" y="148" width="190" height="142" rx="18" fill="#183947" stroke="#35a5ac"/>
    <rect x="1168" y="148" width="264" height="142" rx="18" fill="#322746" stroke="#b585e7"/>
  </g>
  <g fill="none" stroke="#7edbd8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M238 219h24"/><path d="M458 219h24"/><path d="M678 219h24"/><path d="M918 219h24"/><path d="M1138 219h24"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <g fill="#62e0d4" font-size="12" font-weight="700" letter-spacing="1.2"><text x="143" y="180">01 · CODE</text><text x="363" y="180">02 · TYPED JUDGMENT</text><text x="583" y="180">03 · REQUIRED FIRST</text><text x="813" y="180">04 · VALUE-OF-INFO</text><text x="1043" y="180">05 · EVIDENCE GATE</text><text x="1300" y="180">06 · BOUNDED ESCALATION</text></g>
    <g fill="#f4fbff" font-size="20" font-weight="700"><text x="143" y="218">Deterministic</text><text x="363" y="218">JEV route</text><text x="583" y="218">Luna</text><text x="813" y="218">Reflex Fabric</text><text x="1043" y="218">Completion</text><text x="1300" y="218">Sol → Astra</text></g>
    <g fill="#b7cfdd" font-size="13"><text x="143" y="247"><tspan x="143">Exact rules, validation,</tspan><tspan x="143" dy="18">cache and safe fallback</tspan></text><text x="363" y="247"><tspan x="363">One compact batch;</tspan><tspan x="363" dy="18">local policy if unavailable</tspan></text><text x="583" y="247"><tspan x="583">First model attempt</tspan><tspan x="583" dy="18">for every LLM task</tspan></text><text x="813" y="247"><tspan x="813">Routine: local fast path</tspan><tspan x="813" dy="18">Events: call JEV</tspan></text><text x="1043" y="247"><tspan x="1043">Readiness + quality</tspan><tspan x="1043" dy="18">must meet code thresholds</tspan></text><text x="1300" y="247"><tspan x="1300">Only after observable</tspan><tspan x="1300" dy="18">insufficiency; capped budgets</tspan></text></g>
  </g>
  <path d="M1043 301v66H583v-64" fill="none" stroke="#91a7ff" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="810" y="355" text-anchor="middle" fill="#b9b8ff" font-family="Inter,Segoe UI,sans-serif" font-size="13">Continue / change tool / gather evidence; repeat only within configured budgets</text>
  <rect x="308" y="407" width="864" height="96" rx="18" fill="#111f31" stroke="#415870"/>
  <circle cx="350" cy="455" r="17" fill="url(#violet)"/>
  <path d="M343 455h14M350 448v14" stroke="#fff" stroke-width="2.5"/>
  <text x="385" y="446" fill="#f4fbff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">Human authorization boundary</text>
  <text x="385" y="472" fill="#b7cfdd" font-family="Inter,Segoe UI,sans-serif" font-size="14">JEV can recommend a checkpoint; it cannot authorize publishing, purchases, submissions or irreversible actions.</text>
  <text x="56" y="532" fill="#7895a8" font-family="Inter,Segoe UI,sans-serif" font-size="12">Event triggers: failure · conflicting evidence · uncertainty · high risk · irreversible step · phase change · budget pressure</text>
</svg>
