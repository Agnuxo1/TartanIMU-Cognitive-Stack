[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-orchestrator"
version = "2.0.0"
description = "Deterministic-first, Luna-first cognitive orchestration directed by TypeSafe JEV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typesafe-sdk==0.7.0",
  "openai==3.16.2",
  "openai-agents==0.22.3",
  "tiktoken==0.14.0",
  "pydantic>=2.13",
  "python-dotenv>=1.2",
  "rich>=15",
  "httpx>=0.28",
]

[project.scripts]
jev-orchestrator = "jev_orchestrator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["jev_orchestrator*"]
